{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h4 class="card-title mb-3">Verifique seu e-mail</h4>
                <p class="text-muted">Se o e-mail informado estiver cadastrado, você receberá em instantes um link para redefinir sua senha. Confira também a caixa de spam.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">Voltar ao login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
