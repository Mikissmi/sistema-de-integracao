{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Acompanhamento Intersetorial</h4>
                <p class="text-muted small">Educação e Saúde · Nova Santa Rita</p>
                {% if form.errors %}
                    <div class="alert alert-danger">Usuário ou senha inválidos.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
                <p class="text-center small mt-3"><a href="{% url 'password_reset' %}">Esqueci minha senha</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
